<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pxvirt Dependency Tree</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: sans-serif;
        background: #1e1e2e;
        color: #cdd6f4;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
        min-height: 100vh;
      }
      h1 {
        margin-bottom: 1.5rem;
        font-size: 1.4rem;
        color: #cba6f7;
        letter-spacing: 0.05em;
      }
      #error {
        color: #f38ba8;
        background: #313244;
        padding: 1rem;
        border-radius: 8px;
        display: none;
        max-width: 600px;
        white-space: pre-wrap;
      }
      #diagram {
        background: #313244;
        border-radius: 12px;
        padding: 2rem;
        width: 100vw;
        overflow: auto;
      }
      #diagram svg {
        max-width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>
    <h1>pxvirt Package Dependency Tree</h1>
    <pre id="error"></pre>
    <div id="diagram"></div>

    <script>
      mermaid.initialize({
        startOnLoad: false,
        theme: "dark",
        themeVariables: {
          fontSize: "1rem", // Sets font size to small
        },
      });

      fetch("deptree.mmd")
        .then((r) => {
          if (!r.ok)
            throw new Error(
              `Failed to load deptree.mmd: ${r.status} ${r.statusText}`,
            );
          return r.text();
        })
        .then((text) => {
          // Strip YAML frontmatter if present
          const content = text.replace(/^---[\s\S]*?---\n/, "").trim();
          return mermaid.render("graph", content);
        })
        .then(({ svg }) => {
          document.getElementById("diagram").innerHTML = svg;
        })
        .catch((err) => {
          const el = document.getElementById("error");
          el.textContent = err.message;
          el.style.display = "block";
        });
    </script>
  </body>
</html>
